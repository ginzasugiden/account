<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSDアカウント作成</title>
  <!-- reCAPTCHA v3 -->
  <script src="https://www.google.com/recaptcha/api.js?render=6LfpP14sAAAAAPFL0gSo_Ze_h8C91VsEC247xkDD"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      background: #fff;
      max-width: 500px;
      width: 100%;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    h1 {
      text-align: center;
      color: #333;
      margin: 0 0 30px 0;
      font-size: 1.6em;
    }
    .form-group { margin-bottom: 20px; }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #555;
    }
    input[type="text"],
    input[type="email"] {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
    }
    .submit-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .submit-btn:hover:not(:disabled) {
      transform: translateY(-2px);
    }
    .submit-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .message {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      display: none;
    }
    .message.success { background: #d4edda; color: #155724; display: block; }
    .message.error { background: #f8d7da; color: #721c24; display: block; }
    .message.loading { background: #e7f3ff; color: #004085; display: block; }
    .help-text { font-size: 12px; color: #888; margin-top: 5px; }
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #004085;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 1s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .links {
      margin-top: 20px;
      text-align: center;
    }
    .links a {
      color: #667eea;
      text-decoration: none;
      font-size: 14px;
    }
    .links a:hover { text-decoration: underline; }
    .recaptcha-notice {
      font-size: 11px;
      color: #999;
      text-align: center;
      margin-top: 15px;
    }
    .recaptcha-notice a { color: #667eea; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🛒 GSDアカウント作成</h1>
    
    <form id="accountForm">
      <div class="form-group">
        <label for="id">店舗URL（ID部分）</label>
        <input type="text" id="id" name="id" placeholder="例: tokyoflower" required>
        <p class="help-text">楽天店舗URLの /xxx/ 部分のみ入力</p>
      </div>
      
      <div class="form-group">
        <label for="serviceSecret">Service Secret</label>
        <input type="text" id="serviceSecret" name="serviceSecret" 
               placeholder="例: SP240364_MUraZF2oFfd65519" required>
      </div>
      
      <div class="form-group">
        <label for="licenseKey">License Key</label>
        <input type="text" id="licenseKey" name="licenseKey" 
               placeholder="例: SL240364_Jj6TnbFE5Fb24SQ6" required>
      </div>
      
      <div class="form-group">
        <label for="sname">店舗名</label>
        <input type="text" id="sname" name="sname" placeholder="例: 東京フラワー" required>
      </div>

      <div class="form-group">
        <label for="representative_name">代表者氏名<span class="required">*</span></label>
        <input type="text" id="representative_name" name="representative_name" required
               maxlength="40" placeholder="例：銀座 太郎">
        <small>姓と名の間にスペースを入れてください</small>
      </div>

      <div class="form-group">
        <label for="email">メールアドレス</label>
        <input type="email" id="email" name="email" placeholder="例: shop@example.com" required>
      </div>
      
      <button type="submit" class="submit-btn" id="submitBtn">アカウントを作成</button>
    </form>
    
    <div id="message"></div>
    
    <div class="links">
      <a href="reset-request.html">パスワードをお忘れですか？</a>
    </div>
    
    <p class="recaptcha-notice">
      このサイトはreCAPTCHAによって保護されています。
      <a href="https://policies.google.com/privacy" target="_blank">プライバシーポリシー</a>と
      <a href="https://policies.google.com/terms" target="_blank">利用規約</a>が適用されます。
    </p>
  </div>

  <script>
    // ★★★ 設定 ★★★
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxuR0q6FseR6zyvPygFVU2NX4Rm9BX-T9QOjLFZV1f7UPzDhIFjhaIJTuYsmEqLu8R-/exec';
    const RECAPTCHA_SITE_KEY = '6LfpP14sAAAAAPFL0gSo_Ze_h8C91VsEC247xkDD';  // reCAPTCHA
    
    const form = document.getElementById('accountForm');
    const submitBtn = document.getElementById('submitBtn');
    const messageDiv = document.getElementById('message');
    
    // バリデーション
    function validateForm(data) {
      if (!/^SL\d{6}_.+$/.test(data.licenseKey)) {
        return 'License Keyの形式が不正です';
      }
      if (!/^SP\d{6}_.+$/.test(data.serviceSecret)) {
        return 'Service Secretの形式が不正です';
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) {
        return 'メールアドレスの形式が不正です';
      }
      
      const licenseId = data.licenseKey.match(/^SL(\d{6})_/)[1];
      const serviceId = data.serviceSecret.match(/^SP(\d{6})_/)[1];
      if (licenseId !== serviceId) {
        return 'License KeyとService Secretの店舗IDが一致しません';
      }
      return null;
    }
    
    function showMessage(type, text) {
      messageDiv.className = 'message ' + type;
      messageDiv.innerHTML = text;
    }
    
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const formData = new FormData(form);
  const data = {};
  formData.forEach((value, key) => {
    data[key] = value.trim();
  });
  
  // バリデーション
  const error = validateForm(data);
  if (error) {
    showMessage('error', error);
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = '送信中...';
  showMessage('loading', '<span class="spinner"></span>アカウントを作成しています...');
  
  try {
    // reCAPTCHAトークンを取得（エラーハンドリング追加）
    let recaptchaToken = '';
    try {
      if (typeof grecaptcha !== 'undefined') {
        recaptchaToken = await grecaptcha.execute(RECAPTCHA_SITE_KEY, { action: 'account_create' });
        console.log('reCAPTCHA token取得成功');
      } else {
        console.log('grecaptchaが未定義です');
      }
    } catch (recaptchaError) {
      console.error('reCAPTCHAエラー:', recaptchaError);
      // reCAPTCHAエラーでも続行（GAS側でスキップされる）
    }
    
    console.log('GASにリクエスト送信:', GAS_URL);
    
    const response = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        endpoint: '/account/create',
        data: data,
        recaptchaToken: recaptchaToken
      })
    });
    
    console.log('レスポンス受信:', response.status);
    
    const result = await response.json();
    console.log('結果:', result);
    
    if (result.status === 'success') {
      showMessage('success', 
        '✅ ' + result.message + '<br><br>' +
        '確認メールをご確認ください。'
      );
      form.reset();
    } else {
      showMessage('error', '❌ ' + (result.message || '登録に失敗しました'));
    }
    
  } catch (err) {
    console.error('通信エラー詳細:', err);
    showMessage('error', '❌ 通信エラー: ' + err.message);
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'アカウントを作成';
  }
});
  </script>
</body>
</html>
